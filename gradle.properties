# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Build performance
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin compile daemon shares the Gradle daemon JVM. This avoids the
# "daemon terminated unexpectedly on startup" failures seen previously.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

# MACHINE-LOCAL: Android Studio ships JBR 25, which AGP 8.7 does not support.
# This pins the build to the JDK 21 already present on this machine.
# Remove this line if your Studio Gradle JDK is set to 17-21 in Settings.
org.gradle.java.home=C:/Users/Admin/.gradle/jdks/eclipse_adoptium-21-amd64-windows.2
